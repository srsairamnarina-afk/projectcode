<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillBridge AI | My Profile</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/nav.js"></script>
</head>
<body>
<main>
  <div class="section-heading text-center">
    <p class="eyebrow">YOUR PROFILE</p>
    <h2>Manage Your Career Data</h2>
    <p class="subtitle">This data will be used to personalize your SkillBridge AI journey.</p>
  </div>

  <form id="userProfileForm" class="form-card">
    
    <div style="text-align: center; margin-bottom: 30px;">
      <div style="width: 100px; height: 100px; border-radius: 50%; background: #e2e8f0; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid var(--primary);">👤</div>
      <button type="button" class="btn outline-btn small-btn">Change Photo</button>
    </div>

    <h3>Personal Information</h3>
    <hr style="border-top: 1px solid var(--border-color); margin: 15px 0 25px;"><br>
    
    <div class="grid two">
      <div class="field">
        <label>Full Name</label>
        <input name="full_name" id="full_name" placeholder="John Doe">
      </div>
      <div class="field">
        <label>Email</label>
        <input name="email" id="email" type="email" placeholder="john@example.com">
      </div>
      <div class="field">
        <label>Phone Number (Optional)</label>
        <input name="phone" id="phone" placeholder="+1 234 567 8900">
      </div>
      <div class="field">
        <label>Location</label>
        <input name="location" id="location" placeholder="City, Country">
      </div>
    </div>

    <br>
    <h3>Education</h3>
    <hr style="border-top: 1px solid var(--border-color); margin: 15px 0 25px;"><br>
    
    <div class="grid two">
      <div class="field">
        <label>College / University</label>
        <input name="college" id="college" placeholder="XYZ University">
      </div>
      <div class="field">
        <label>Degree</label>
        <input name="degree" id="degree" placeholder="B.E.">
      </div>
      <div class="field">
        <label>Branch / Specialization</label>
        <input name="branch" id="branch" placeholder="Computer Science">
      </div>
      <div class="field">
        <label>Graduation Year</label>
        <input name="grad_year" id="grad_year" type="number" placeholder="2026">
      </div>
      <div class="field">
        <label>CGPA / Percentage</label>
        <input name="cgpa" id="cgpa" placeholder="8.5">
      </div>
    </div>

    <br>
    <h3>Career Information & Skills</h3>
    <hr style="border-top: 1px solid var(--border-color); margin: 15px 0 25px;"><br>

    <div class="grid two">
      <div class="field">
        <label>Target Job Role *</label>
        <input name="target_role" id="target_role" required placeholder="Software Developer">
      </div>
      <div class="field">
        <label>Experience (years)</label>
        <input name="experience" id="experience" type="number" min="0" step="0.5" value="0">
      </div>
    </div>
    
    <div class="field">
      <label>Current Skills</label>
      <textarea name="skills" id="skills" rows="3" placeholder="Python, Java, SQL, HTML, CSS..."></textarea>
      <small>Separate skills with commas.</small>
    </div>

    <button class="btn primary full" type="submit" style="margin-top: 20px;">Save Changes</button>
    <div id="saveMsg" style="text-align: center; margin-top: 15px; color: var(--success); font-weight: 700; display: none;">Profile Saved Successfully!</div>
  </form>
</main>
<footer>SkillBridge AI • Engineering Major Project</footer>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Load existing profile
    const profile = JSON.parse(localStorage.getItem('sb_profile') || '{}');
    
    document.getElementById('full_name').value = profile.full_name || '';
    document.getElementById('email').value = profile.email || '';
    document.getElementById('phone').value = profile.phone || '';
    document.getElementById('location').value = profile.location || '';
    document.getElementById('college').value = profile.college || '';
    document.getElementById('degree').value = profile.degree || '';
    document.getElementById('branch').value = profile.branch || '';
    document.getElementById('grad_year').value = profile.grad_year || '';
    document.getElementById('cgpa').value = profile.cgpa || '';
    document.getElementById('target_role').value = profile.target_role || '';
    document.getElementById('experience').value = profile.experience || 0;
    document.getElementById('skills').value = profile.skills || '';
  });

  document.getElementById('userProfileForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const profile = {
      full_name: document.getElementById('full_name').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      location: document.getElementById('location').value,
      college: document.getElementById('college').value,
      degree: document.getElementById('degree').value,
      branch: document.getElementById('branch').value,
      grad_year: document.getElementById('grad_year').value,
      cgpa: document.getElementById('cgpa').value,
      target_role: document.getElementById('target_role').value,
      experience: document.getElementById('experience').value,
      skills: document.getElementById('skills').value
    };
    
    localStorage.setItem('sb_profile', JSON.stringify(profile));
    
    const msg = document.getElementById('saveMsg');
    msg.style.display = 'block';
    setTimeout(() => { msg.style.display = 'none'; }, 3000);
  });
</script>
</body>
</html>
