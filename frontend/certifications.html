<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillBridge AI | Certifications</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/nav.js"></script>
</head>
<body>
<main class="results-page">
  <div class="section-heading text-center" style="margin-top: 20px;">
    <p class="eyebrow">STEP 3: VALIDATION</p>
    <h1 class="gradient-text">Recommended Certifications</h1>
    <p class="subtitle">Validate your skills to stand out to employers hiring for <strong id="roleTitle">...</strong></p>
  </div>

  <section class="result-card glass-panel full-width">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
      <h2 style="margin: 0;">🎓 Official Certifications</h2>
      <div>
        <select style="width: auto; padding: 8px 12px; font-size: 14px;">
          <option>All Statuses</option>
          <option>Recommended</option>
          <option>In Progress</option>
          <option>Completed</option>
        </select>
      </div>
    </div>
    
    <div id="certifications" class="resource-grid"></div>
  </section>

  <div class="text-center" style="margin-top: 40px;">
    <a href="/companies" class="btn primary btn-large">View Companies & Jobs →</a>
  </div>
</main>

<script>
const data = JSON.parse(sessionStorage.getItem("skillbridgeResult") || "null");

if (!data) {
  window.location.href = "/skill-analyzer";
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

document.getElementById("roleTitle").textContent = data.job_role;

document.getElementById("certifications").innerHTML =
  data.certifications.map(c => `
    <div class="resource-box">
      <div style="display: flex; justify-content: space-between; align-items: start;">
        <span class="badge">${escapeHtml(c.level)}</span>
        <span style="font-size: 12px; font-weight: bold; color: var(--primary); background: rgba(37,99,235,0.1); padding: 4px 8px; border-radius: 4px;">Recommended</span>
      </div>
      <h3>${escapeHtml(c.certification)}</h3>
      <p class="provider">🏢 ${escapeHtml(c.provider)}</p>
      <a href="${c.url}" target="_blank" rel="noopener" class="btn primary small-btn mt-auto">View Certification</a>
    </div>
  `).join("") || "<p class='muted'>No certification mapped yet for this role.</p>";
</script>
</body>
</html>
